[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baseline-coding-agent"
version = "0.1.0"
description = "A small, observable coding-agent baseline"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2,<3",
  "typer>=0.12",
  "langgraph>=1.2.11,<2",
  "langchain>=1.4,<2",
  "langchain-openai>=1.6,<2",
  "langchain-deepseek>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
coding-agent = "coding_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["coding_agent"]
